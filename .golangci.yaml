version: "2"

linters:
  enable:
    - lll
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintln

    lll:
      line-length: 88

formatters:
  enable:
    - goimports
    - golines
    - swaggo
  settings:
    goimports:
      # A list of prefixes, which, if set, checks import paths
      # with the given prefixes are grouped after 3rd-party packages.
      # Default: []
      local-prefixes:
        - github.com/shsiddhant/mone-pore
    golines:
      # Target maximum line length.
      # Default: 100
      max-len: 88
      # Length of a tabulation.
      # Default: 4
      # tab-len: 8
      # Shorten single-line comments.
      # Default: false
      # shorten-comments: true
      # Default: true
      # reformat-tags: false
      # Split chained methods on the dots as opposed to the arguments.
      # Default: true
      # chain-split-dots: false
